name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build release binaries
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/wspe \
            target/aarch64-apple-darwin/release/wspe \
            target/x86_64-apple-darwin/release/wspe
          file target/universal-apple-darwin/release/wspe

      - name: Package release assets
        run: |
          TAG="${{ github.ref_name }}"
          DIST_DIR="dist"
          mkdir -p "$DIST_DIR"

          package_target() {
            local target="$1"
            local binary_path="$2"
            local folder_name="wspe-${TAG}-${target}"

            mkdir -p "$folder_name"
            cp "$binary_path" "$folder_name/wspe"
            chmod +x "$folder_name/wspe"
            cp install.sh README.adoc LICENSE "$folder_name/"

            tar -czf "$DIST_DIR/${folder_name}.tar.gz" "$folder_name"
            zip -r "$DIST_DIR/${folder_name}.zip" "$folder_name"
            rm -rf "$folder_name"
          }

          package_target "universal-apple-darwin" "target/universal-apple-darwin/release/wspe"
          package_target "aarch64-apple-darwin" "target/aarch64-apple-darwin/release/wspe"
          package_target "x86_64-apple-darwin" "target/x86_64-apple-darwin/release/wspe"

          cd "$DIST_DIR"
          shasum -a 256 *.tar.gz *.zip > SHA256SUMS.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
